name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # runs once a day
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main # change this to "master" if that's your default branch

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake with real GitHub green shades
        uses: Platane/snk@v3
        with:
          github_user_name: princebhandarii
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=orange&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            dist/github-contribution-grid-snake-dark.svg?color_snake=orange&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Push generated SVGs to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
